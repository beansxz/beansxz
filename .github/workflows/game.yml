name: Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Create dist folder
        run: mkdir -p dist
      - uses: czl9707/gh-space-shooter@main
        with:
          username: beansxz
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/github-contribution-space-shooter.gif
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}