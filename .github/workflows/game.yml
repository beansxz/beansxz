name: Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: czl9707/gh-space-shooter@main
        with:
          github_user_name: beansxz
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_dir: dist
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}