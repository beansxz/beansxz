<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-light" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#0a0a0a" fill-opacity="0.9" />
    </pattern>
    <radialGradient id="fade-light" cx="82%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="mask-light">
      <rect width="1200" height="300" fill="url(#fade-light)" />
    </mask>
  </defs>

  <rect width="1200" height="300" fill="#ffffff" />
  <rect width="1200" height="300" fill="url(#dots-light)" mask="url(#mask-light)" />

  <text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#a3a3a3">GITHUB.COM/YOUR-USERNAME</text>

  <text x="62" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="66" font-weight="700" letter-spacing="1" fill="#0a0a0a">YOUR NAME</text>

  <text x="64" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#737373">your tagline goes here — web developer</text>

  <line x1="64" y1="230" x2="340" y2="230" stroke="#e9e9e9" stroke-width="1" />

  <text x="64" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#a3a3a3">00 — PROFILE</text>
</svg>
